name: Offline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint scripts src --max-warnings 0
      - name: Offline checks
        run: npm run check:offline
